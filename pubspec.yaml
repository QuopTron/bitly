name: bitly
description: Download Spotify tracks in FLAC from Tidal, Qobuz & Deezer
publish_to: "none"
version: 0.9.1+10

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.5
  get_it: ^8.0.0
  go_router: ^17.2.3

  # Storage
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  path: ^1.9.0

  # HTTP & Network
  http: ^1.6.0
  connectivity_plus: ^7.1.1

  # UI Components
  cached_network_image: ^3.4.1

  # Permissions
  permission_handler: ^12.0.2

  # File Picker
  file_picker: ^12.0.0-beta.5

  # Utils
  url_launcher: ^6.3.1
  share_plus: ^13.1.0
  logger: ^2.5.0
  meta: ^1.17.0

  # FFmpeg for audio conversion (audio-only build: decrypt + FLAC mux only,
  # much smaller than the full build and lighter on RAM while decrypting)
  ffmpeg_kit_flutter_new_audio: ^2.5.0
  open_filex: ^4.7.0

  # Audio / Video player for in-app streaming
  media_kit: ^1.1.10
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.0.4
  media_kit_libs_windows_video: ^1.0.4

  # Database (Drift ORM). sqlite3_flutter_libs bundles libsqlite3.so into the
  # APK — without it the FFI loader can't find SQLite on Android and the app
  # dies at startup (backend never initializes).
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.5.42

  # Crypto (HMAC for premium codes)
  crypto: ^3.0.4

  # WebView for Cloudflare verification
  webview_flutter: ^4.0.0
  webview_flutter_android: ^3.16.9
  audio_service: ^0.18.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  drift_dev: ^2.34.0

  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon.png"
  image_path_android: "icon_android.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "icon_foreground_android.png"
  adaptive_icon_foreground_inset: 16
  adaptive_icon_monochrome: "icon_foreground_android.png"
  ios_content_mode: scaleAspectFill
  remove_alpha_ios: true
  background_color_ios: "#000000"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/extensions/

  fonts:
    - family: Google Sans Flex
      fonts:
        - asset: assets/fonts/GoogleSansFlex.ttf
