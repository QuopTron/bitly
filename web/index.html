<!doctype html>
<html>
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="Bitly — Escucha, descarga y organiza tu música favorita."
    />

    <!-- iOS PWA meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Bitly" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />
    <meta name="theme-color" content="#0D0D0D" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.json" />

    <title>Bitly — Música sin límites</title>
  </head>
  <body>
    <script src="flutter_bootstrap.js" async></script>
    <script>
      // Registrar service worker para PWA (offline + home screen)
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service_worker.js")
            .then((reg) =>
              console.log("[PWA] Service Worker registrado:", reg.scope),
            )
            .catch((err) =>
              console.log("[PWA] Service Worker no registrado:", err),
            );
        });
      }
    </script>
  </body>
</html>
