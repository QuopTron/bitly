# Release — Compila los binarios y los publica como GitHub Release
#
# Reemplaza al Play Store: cada vez que se crea un tag vX.Y.Z (o se ejecuta
# manualmente con workflow_dispatch), este workflow:
#   1. release-android: compila el backend Go como AAR (gomobile) y los APKs
#      release con --split-per-abi, uno por arquitectura.
#   2. release-windows: compila el backend Go, la app Windows release y arma
#      el instalador .exe con Inno Setup.
#   3. Publica todo en la MISMA GitHub Release con NOMBRES CONSISTENTES (los
#      mismos que lee el detector de versiones de la app y el sitio web del
#      proyecto):
#        · Android: app-arm64-v8a-release.apk
#                   app-armeabi-v7a-release.apk
#                   app-x86_64-release.apk
#        · Windows: Bitly-Setup-X.Y.Z.exe
#
# La firma usa el keystore de debug (como el build local), así que el APK
# instala encima de versiones anteriores sin perder datos — no se necesitan
# secretos de firma.

name: Release

# SOLO manual (workflow_dispatch). El release se sube a mano desde la app
# (gh release / drag & drop): así los binarios salen del build local con los
# secretos reales y con los nombres consistentes, y el workflow de CI no
# pisa esa release con binarios de placeholders.
on:
  workflow_dispatch:

permissions:
  contents: write # necesario para crear el Release y subir los assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-android:
    name: Build & Release Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necesario para generar las release notes desde el último tag

      - name: Read version from pubspec
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Usando versión: $VERSION"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      # El NDK debe resolverse ANTES de `gomobile init` (necesita ANDROID_NDK_HOME).
      # IMPORTANTE: se exportan ANDROID_SDK_ROOT/ANDROID_HOME/ANDROID_NDK_HOME a
      # GITHUB_ENV. Las variables predefinidas del runner NO están en el contexto
      # `env` de Actions (por eso `${{ env.ANDROID_SDK_ROOT }}` llegaba vacío y
      # gomobile buscaba el SDK en su default /home/runner/Android/Sdk).
      - name: Resolve Android SDK/NDK
        id: ndk
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK no encontrado (ANDROID_SDK_ROOT/ANDROID_HOME vacíos)"
            exit 1
          fi
          NDK_PATH=$(ls -d "$SDK_ROOT/ndk"/*/ 2>/dev/null | head -1 | sed 's:/$::')
          if [ -z "$NDK_PATH" ]; then
            echo "::error::Android NDK no encontrado en $SDK_ROOT/ndk"
            exit 1
          fi
          echo "sdk_root=$SDK_ROOT" >> "$GITHUB_OUTPUT"
          echo "ndk_path=$NDK_PATH" >> "$GITHUB_OUTPUT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile init

      # El AAR está gitignored; Flutter lo enlaza desde android/app/libs.
      # El tee + ::error:: publica el log real como annotation del check-run
      # para poder diagnosticar fallos desde la API sin auth.
      - name: Build Go backend AAR (Android)
        run: |
          set -o pipefail
          cd go_backend
          if ! gomobile bind -target=android -androidapi=24 -o "../android/app/libs/bitly.aar" . 2>&1 | tee /tmp/gomobile.log; then
            echo "::error::=== gomobile bind FAILED (tail del log) ==="
            tail -40 /tmp/gomobile.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
        env:
          ANDROID_SDK_ROOT: ${{ steps.ndk.outputs.sdk_root }}
          ANDROID_HOME: ${{ steps.ndk.outputs.sdk_root }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk_path }}

      # Fijada a la versión que compila localmente (3.41.6). `stable` instala
      # la ÚLTIMA versión y su plugin Flutter-Gradle choca con el AGP 8.9.1
      # del proyecto.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          cache: true

      # secrets.dart está gitignored (token real). Se genera desde el template
      # con el token guardado como secret PREMIUM_GITHUB_TOKEN.
      - name: Generate secrets.dart
        run: |
          cp lib/config/secretos.example.dart lib/config/secretos.dart
          TOKEN="${{ secrets.PREMIUM_GITHUB_TOKEN }}"
          if [ -n "$TOKEN" ]; then
            sed -i "s|tu_github_token_aqui|$TOKEN|" lib/config/secrets.dart
          fi

      - name: Flutter pub get
        run: flutter pub get

      # Firma de release: decodifica el keystore desde los secretos y crea
      # android/key.properties para que Gradle firme con el keystore propio
      # (no el debug). Sin este paso la build cae al keystore de debug y las
      # actualizaciones entre releases dejarían de ser compatibles.
      - name: Prepare Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/bitly-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore/bitly-release.keystore
          EOF
          echo "Keystore de release listo"

      # Split-per-abi: un APK delgado por arquitectura. Flutter genera los tres
      # (arm64-v8a, armeabi-v7a y x86_64) con los nombres que la app y el sitio
      # esperan — NO se renombran.
      - name: Build release APKs (split-per-abi)
        run: |
          set -o pipefail
          if ! flutter build apk --release --split-per-abi 2>&1 | tee /tmp/flutter_build.log; then
            echo "::error::=== flutter build apk FAILED (tail del log) ==="
            tail -50 /tmp/flutter_build.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      # Nombres consistentes: app-<abi>-release.apk (tal cual los produce
      # Flutter y tal cual los busca el detector de versiones).
      - name: Collect APKs
        run: |
          mkdir -p dist
          cd build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "app-$abi-release.apk" ]; then
              cp "app-$abi-release.apk" "$GITHUB_WORKSPACE/dist/app-$abi-release.apk"
            else
              echo "::error::Falta el APK app-$abi-release.apk"
              exit 1
            fi
          done
          ls -lh "$GITHUB_WORKSPACE/dist"

      - name: Publish GitHub Release (Android)
        uses: softprops/action-gh-release@v2
        with:
          name: "Bitly ${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true

  release-windows:
    name: Build & Release Windows
    runs-on: windows-latest
    needs: release-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from pubspec
        id: version
        shell: bash
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Usando versión: $VERSION"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      # El backend Go se bundlea junto al runner (windows/CMakeLists.txt).
      - name: Build Go backend (Windows)
        shell: bash
        run: |
          mkdir -p windows/backend
          cd go_backend
          go build -ldflags="-s -w" -o "../windows/backend/bitly-backend.exe" ./cmd/server

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          cache: true

      - name: Generate secrets.dart
        shell: bash
        run: |
          cp lib/config/secretos.example.dart lib/config/secretos.dart
          TOKEN="${{ secrets.PREMIUM_GITHUB_TOKEN }}"
          if [ -n "$TOKEN" ]; then
            sed -i "s|tu_github_token_aqui|$TOKEN|" lib/config/secrets.dart
          fi

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      # El instalador debe salir SIEMPRE limpio (sin sesiones firmadas ni
      # stores cacheados) para forzar verificar las extensiones en cada
      # instalación nueva.
      - name: Clean signed sessions
        shell: bash
        run: |
          RELEASE="build/windows/x64/runner/Release"
          rm -rf "$RELEASE/signed_sessions" "$RELEASE/ext_data/signed_sessions"
          rm -f "$RELEASE/signed_session_debug.log" "$RELEASE/ext_data/signed_session_debug.log"
          rm -f "$RELEASE"/*_store.json || true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: bash
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          mkdir -p dist
          "$ISCC" "/DMyAppVersion=${{ steps.version.outputs.version }}" scripts/instalador_windows.iss
          ls -lh dist/

      - name: Publish GitHub Release (Windows)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/Bitly-Setup-*.exe
          fail_on_unmatched_files: true
