# CI/CD — Builds de Bitly (Windows + Android + iOS best-effort)
#
# - `test`:          gate de calidad (Go vet/test + Flutter analyze/test)
# - `build-windows`: compila el backend Go para Windows y la app Flutter (release)
# - `build-android`: compila el AAR Go con gomobile y el APK release
# - `build-ios`:     best-effort en macOS (solo manual o tags). iOS NO puede
#                    generarse en runners de Windows/Linux (requiere macOS/Xcode
#                    + firmado), por lo que si se omite o falla, el job `notify`
#                    lo reporta explícitamente.
# - `notify`:        resume el estado de todos los builds y notifica (summary +
#                    comentario en PR) incluyendo el motivo por el que iOS no
#                    se generó.

name: CI/CD Builds

on:
  push:
    branches: [main, recuperacion]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_ios:
        description: "Intentar el build de iOS (usa un runner macOS con Xcode)"
        type: boolean
        default: false

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Gate de calidad ────────────────────────────────────────────────
  test:
    name: Tests (Go + Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      - name: Go vet
        run: cd go_backend && go vet ./...

      - name: Go test
        run: cd go_backend && go test ./... -count=1 -timeout=180s

      # ── Calidad extra (mejores prácticas Go) ────────────────────────
      # Formato: el árbol debe estar gofmt-limpio (gofmt -l vacío). Atrapa
      # CRLF reintroducido y archivos sin formatear.
      - name: Go format check
        run: |
          cd go_backend
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "::error::Archivos sin gofmt:"
            echo "$UNFORMATTED" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      # staticcheck: atrapa bugs que el compilador no ve (código muerto,
      # condiciones sin efecto, literales mágicos, uso de APIs deprecadas).
      - name: Go staticcheck
        run: cd go_backend && go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...

      # govulncheck: alerta si alguna dependencia tiene vulnerabilidades
      # alcanzables por el código (falla solo con vulns reales).
      - name: Go govulncheck
        run: cd go_backend && go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      # Race detector en TODO el backend: detecta data races en goroutines
      # (pipeline de streaming, descarga paralela por tramos, pool de sesiones,
      # orquestador, DNS, sandboxes goja, bridge).
      #
      # Se corre sobre ./... y no sobre una lista fija de paquetes: la lista
      # anterior dejaba fuera justo los paquetes que más concurrencia agregaron
      # (sessionpool, provider/flacrescue, search), y un paquete nuevo no
      # entraba a la lista solo por existir. Con ./... cualquier código nuevo
      # queda cubierto sin tener que acordarse de editarlo acá.
      #
      # Los runners ubuntu tienen cgo y gcc, así que -race funciona sin nada
      # extra. En Windows hace falta un compilador C: ver
      # scripts/pruebas/race_windows.sh (mismos paquetes, zig como CC).
      # Costo medido: ~26s en la suite completa.
      - name: Go test -race (todo el backend)
        run: cd go_backend && go test -race ./... -count=1 -timeout=480s

      # ── Verificadores de extensiones (JavaScript, offline) ──────────
      # Las extensiones corren en un sandbox goja DENTRO del backend, así que
      # `go test` no las cubre y sus bugs son silenciosos: la app no crashea,
      # simplemente "esa fuente no encuentra audio" o "tarda muchísimo", y desde
      # afuera parece un problema de red. scripts/pruebas/pruebas_extensiones.sh carga
      # cada extensión real con `http`/`log`/`utils`/`registerExtension` falsos y
      # verifica los contratos que YA se rompieron una vez:
      #   - SoundCloud: un 401 no debe terminar en `client_id=null` ni en una
      #     tormenta de reintentos; debe fallar con "HTTP 401" para que el
      #     cooldown de Go enfríe la fuente.
      #   - Deezer / Tidal / Qobuz: rotación del pool de credenciales.
      #   - YouTube Music: el proveedor de PO Token (bgutil) que evita el
      #     "confirmá que no sos un bot" en IPs marcadas.
      #   - Enlaces compartidos: una URL real debe convertirse en el ítem
      #     correcto, en las 7 fuentes que resuelven enlaces (Spotify, YouTube,
      #     Deezer, Tidal, Qobuz, Amazon, Apple), con sus ISRC / UPC e ids
      #     cross-proveedor (con ?si= y ?feature=shared incluidos). Incluye un
      #     auto-test que borra searchParams.has para reproducir el bug del
      #     polyfill y comprobar que el harness lo caza.
      # Cada harness corre DOS veces: contra assets/extensions/ y contra la copia
      # embebida en go_backend/internal/bundled_extensions/ — la app ejecuta la
      # embebida, así que verificar solo assets daría un verde falso.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verificadores de extensiones
        run: |
          set -o pipefail
          if ! bash scripts/pruebas/pruebas_extensiones.sh 2>&1 | tee /tmp/ext.log; then
            echo "::error::=== verificadores de extensiones FAILED ==="
            grep -E "FALLA|FALLARON|difiere" /tmp/ext.log | head -10 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      # Fijada a la versión que compila localmente (3.41.6). `stable` instala
      # la ÚLTIMA versión y su plugin Flutter-Gradle choca con el AGP 8.9.1
      # del proyecto (error: exception applying dev.flutter.flutter-gradle-plugin).
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          cache: true

      # secrets.dart está gitignored (token real). El código lo importa en
      # compilación, así que hay que generarlo desde el template también aquí.
      - name: Generate secrets.dart
        run: cp lib/config/secretos.example.dart lib/config/secretos.dart

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: |
          set -o pipefail
          # Solo falla en errores reales. Hay 12 lints menores (warnings/infos)
          # pre-existentes; por defecto flutter analyze falla con CUALQUIER issue.
          if ! flutter analyze --no-fatal-warnings --no-fatal-infos lib/ 2>&1 | tee /tmp/analyze.log; then
            echo "::error::=== flutter analyze FAILED (tail del log) ==="
            tail -40 /tmp/analyze.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Flutter test
        run: |
          set -o pipefail
          if ! flutter test 2>&1 | tee /tmp/test.log; then
            echo "::error::=== flutter test FAILED (tail del log) ==="
            tail -40 /tmp/test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

  # ─── Build Windows (release) ────────────────────────────────────────
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      # El EXE está gitignored; el CMake lo empaqueta junto al runner solo si
      # existe al configurar el build, así que se compila antes que Flutter.
      - name: Build Go backend (Windows)
        run: |
          cd go_backend
          go build -ldflags="-s -w" -o "../windows/backend/bitly-backend.exe" ./cmd/server

      # Fijada a la versión que compila localmente (3.41.6). `stable` instala
      # la ÚLTIMA versión y su plugin Flutter-Gradle choca con el AGP 8.9.1
      # del proyecto (error: exception applying dev.flutter.flutter-gradle-plugin).
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          cache: true

      - name: Generate secrets.dart
        run: cp lib/config/secretos.example.dart lib/config/secretos.dart

      - name: Flutter pub get
        run: flutter pub get

      # El plugin libtorrent_flutter extrae su zip con `cmake -E tar`, que usa
      # libarchive. Acá el plugin vive detrás de .plugin_symlinks y libarchive
      # rechaza escribir a través de un symlink ("Cannot extract through
      # symlink"). Dejamos el prebuilt listo antes de compilar.
      - name: Preparar prebuilt de libtorrent (x64)
        shell: pwsh
        run: ./scripts/build/preparar_libtorrent_windows.ps1 -Arch x64

      # El default de shell en runners Windows es PowerShell, no bash — se fija
      # bash explícitamente para que el pipefail/tee/grep del diagnóstico funcionen.
      - name: Build Windows release
        shell: bash
        run: |
          set -o pipefail
          if ! flutter build windows --release 2>&1 | tee /tmp/windows.log; then
            echo "::error::=== flutter build windows FAILED (errores del log) ==="
            grep -iE "error|failed|exception|CMake Error|ninja:|MSB[0-9]+|fatal|Cannot|unable|missing|not found" /tmp/windows.log | tail -50 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      # El bundle tiene que traer el CRT de MSVC (msvcp140/vcruntime140…). Sin
      # él la app solo arranca en PCs que ya tengan el Redistribuible de Visual
      # C++ instalado; en una PC nueva Windows falla con "no se encuentra
      # VCRUNTIME140.dll". Se comprueba acá para que ese bundle nunca se
      # publique como si estuviera bien.
      - name: Verify MSVC runtime in bundle
        shell: bash
        run: bash scripts/build/check_windows_bundle.sh build/windows/x64/runner/Release

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: bitly-windows
          path: build/windows/x64/runner/Release/
          if-no-files-found: error

  # ─── Build Android (APK release) ────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      # El NDK debe resolverse ANTES de `gomobile init` (necesita ANDROID_NDK_HOME).
      # IMPORTANTE: se exportan ANDROID_SDK_ROOT/ANDROID_HOME/ANDROID_NDK_HOME a
      # GITHUB_ENV. Las variables predefinidas del runner NO están en el contexto
      # `env` de Actions (por eso `${{ env.ANDROID_SDK_ROOT }}` llegaba vacío y
      # gomobile buscaba el SDK en su default /home/runner/Android/Sdk).
      - name: Resolve Android SDK/NDK
        id: ndk
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK no encontrado (ANDROID_SDK_ROOT/ANDROID_HOME vacíos)"
            exit 1
          fi
          NDK_PATH=$(ls -d "$SDK_ROOT/ndk"/*/ 2>/dev/null | head -1 | sed 's:/$::')
          if [ -z "$NDK_PATH" ]; then
            echo "::error::Android NDK no encontrado en $SDK_ROOT/ndk"
            exit 1
          fi
          echo "sdk_root=$SDK_ROOT" >> "$GITHUB_OUTPUT"
          echo "ndk_path=$NDK_PATH" >> "$GITHUB_OUTPUT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile init

      # El AAR está gitignored; Flutter lo enlaza desde android/app/libs.
      # El directorio no existe en un checkout fresco (gitignored), y gomobile
      # no crea el padre del archivo de salida — sin el mkdir el paso falla
      # con "open ../android/app/libs/bitly.aar: no such file or directory".
      # OJO: el mkdir debe correr DENTRO de go_backend (donde ../ apunta a la
      # raíz del repo); desde la raíz, ../android/app/libs caería FUERA del
      # repo y gomobile seguiría sin encontrar el directorio.
      - name: Build Go backend AAR (Android)
        run: |
          cd go_backend
          mkdir -p ../android/app/libs
          gomobile bind -target=android -androidapi=24 -o "../android/app/libs/bitly.aar" .
        # ANDROID_* ya están en GITHUB_ENV desde el paso Resolve Android SDK/NDK.
        # (El contexto `env` de Actions no expone las predefinidas del runner.)
        env:
          ANDROID_SDK_ROOT: ${{ steps.ndk.outputs.sdk_root }}
          ANDROID_HOME: ${{ steps.ndk.outputs.sdk_root }}
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk_path }}

      # Fijada a la versión que compila localmente (3.41.6). `stable` instala
      # la ÚLTIMA versión y su plugin Flutter-Gradle choca con el AGP 8.9.1
      # del proyecto (error: exception applying dev.flutter.flutter-gradle-plugin).
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          cache: true

      - name: Generate secrets.dart
        run: cp lib/config/secretos.example.dart lib/config/secretos.dart

      - name: Flutter pub get
        run: flutter pub get

      # Firma: decodifica el keystore de release desde los secretos.
      - name: Prepare Android signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64; se firmará con debug"
            exit 0
          fi
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/bitly-release.keystore
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore/bitly-release.keystore
          EOF
          echo "Keystore de release listo"

      # INCLUDE_X86_64: android/app/build.gradle.kts excluye el ABI x86_64
      # (emulador/Chromebook) salvo que la variable valga "true". El release de
      # GitHub publica los TRES APKs, así que el APK de CI tiene que cubrir las
      # mismas arquitecturas para que lo que se prueba acá sea lo que se publica.
      - name: Build Android release APK
        env:
          INCLUDE_X86_64: "true"
        run: flutter build apk --release

      - name: Upload artifact (Android)
        uses: actions/upload-artifact@v4
        with:
          name: bitly-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # ─── Build iOS (best-effort, solo macOS) ────────────────────────────
  # iOS no puede generarse en runners de Windows/Linux: requiere macOS + Xcode
  # + firmado. Se intenta únicamente de forma manual (workflow_dispatch con
  # include_ios) o al publicar un tag. Cualquier fallo no rompe el workflow:
  # el job `notify` reporta el motivo.
  build-ios:
    name: Build iOS (best-effort)
    runs-on: macos-latest
    needs: test
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.include_ios == true)
      || startsWith(github.ref, 'refs/tags/')
    # continue-on-error: un fallo de iOS no rompe el workflow. Nota: con este
    # flag el job se reporta como 'success' en needs.*.result incluso si falla;
    # el job `notify` distingue el estado real mediante el output ios_status
    # (seteado por el step ios_report con if: always()), no por result.
    continue-on-error: true
    outputs:
      ios_status: ${{ steps.ios_report.outputs.ios_status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile init

      # El destino tiene que ser ios/Frameworks/: es la ruta que declara el
      # podspec (ios/GoBackend.podspec → `Frameworks/Gobackend.xcframework`).
      # Compilando a ios/Runner/ el framework quedaba fuera del alcance del pod,
      # así que el build seguía de largo con el stub (#if canImport(GoBackend))
      # y la app salía SIN backend Go, en silencio.
      # El mkdir hace falta porque gomobile NO crea el directorio padre.
      - name: Build Go backend framework (iOS)
        run: |
          mkdir -p ios/Frameworks
          cd go_backend
          gomobile bind -target=ios -o "../ios/Frameworks/Gobackend.xcframework" .

      # Fijada a la versión que compila localmente (3.41.6). `stable` instala
      # la ÚLTIMA versión y su plugin Flutter-Gradle choca con el AGP 8.9.1
      # del proyecto (error: exception applying dev.flutter.flutter-gradle-plugin).
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          cache: true

      - name: Generate secrets.dart
        run: cp lib/config/secretos.example.dart lib/config/secretos.dart

      - name: Flutter pub get
        run: flutter pub get

      # El repo no tiene Podfile; Flutter lo genera y corre `pod install`. En un
      # runner limpio, plugins como ffmpeg_kit necesitan el repo de CocoaPods
      # actualizado. Best-effort: un fallo aquí NO rompe el workflow (notify lo
      # reporta).
      - name: CocoaPods repo update
        run: pod repo update || true

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Report iOS build result
        id: ios_report
        if: always()
        run: |
          if [ -d "build/ios/iphoneos" ]; then
            echo "ios_status=built" >> "$GITHUB_OUTPUT"
          else
            echo "ios_status=failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload artifact (iOS)
        if: steps.ios_report.outputs.ios_status == 'built'
        uses: actions/upload-artifact@v4
        with:
          name: bitly-ios
          path: build/ios/iphoneos/*.app
          if-no-files-found: warn

  # ─── Build Web (PWA) ──────────────────────────────────────────────
  build-web:
    name: Build Web (PWA)
    runs-on: ubuntu-latest
    needs: test
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.include_ios == true)
      || startsWith(github.ref, 'refs/tags/')
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go_backend/go.mod
          cache-dependency-path: go_backend/go.sum

      # El binario Go se compila para Linux (el VPS probablemente es Linux)
      - name: Build Go backend (Linux amd64)
        run: |
          cd go_backend
          go build -ldflags="-s -w" -o ../build/web/bitly-backend ./cmd/server

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          cache: true

      - name: Generate secrets.dart
        run: cp lib/config/secretos.example.dart lib/config/secretos.dart

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Flutter web
        run: flutter build web --release --base-href /

      # Copiar el binario Go al directorio de build web
      - name: Prepare web artifact
        run: |
          mkdir -p dist/web
          cp -R build/web/* dist/web/
          chmod +x build/web/bitly-backend
          cp build/web/bitly-backend dist/web/
          echo "=== Web build contents ==="
          ls -lh dist/web/
          du -sh dist/web/

      - name: Upload artifact (Web/PWA)
        uses: actions/upload-artifact@v4
        with:
          name: bitly-web
          path: dist/web/
          if-no-files-found: error

  # ─── Notificación del estado de builds ──────────────────────────────
  notify:
    name: Notify build status
    runs-on: ubuntu-latest
    needs: [build-windows, build-android, build-ios, build-web]
    if: always()
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Compose summary
        id: compose
        run: |
          WIN="${{ needs.build-windows.result }}"
          AND="${{ needs.build-android.result }}"
          IOS_JOB="${{ needs.build-ios.result }}"
          IOS_OUT="${{ needs.build-ios.outputs.ios_status }}"
          WEB="${{ needs.build-web.result }}"

          echo "## 🏗️ Bitly — Estado de builds" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Plataforma | Estado |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🪟 Windows | $WIN |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🤖 Android | $AND |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🌐 Web (PWA) | $WEB |" >> "$GITHUB_STEP_SUMMARY"
          if [ "$IOS_JOB" = "skipped" ]; then
            echo "| 🍎 iOS | ⚠️ No generado |" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$IOS_OUT" = "built" ]; then
            echo "| 🍎 iOS | ✅ Generado |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| 🍎 iOS | ❌ No se pudo generar |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$IOS_JOB" = "skipped" ]; then
            echo "> 🍎 **iOS no se generó** en esta ejecución: los runners de Windows/Linux no pueden compilar iOS. Requiere un runner de **macOS** con Xcode + configuración de firmado. Para intentarlo, ejecuta el workflow manualmente con el input \`include_ios\` o publica un tag." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$IOS_OUT" != "built" ]; then
            echo "> 🍎 **iOS no se pudo generar**: revisa los logs del job \`build-ios\`. Causas típicas: falta el Podfile (se genera solo), falta firmado, o el proyecto Xcode aún no enlaza \`Gobackend.xcframework\`." >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "ios_job=$IOS_JOB" >> "$GITHUB_OUTPUT"
          echo "ios_out=$IOS_OUT" >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const win = '${{ needs.build-windows.result }}';
            const and = '${{ needs.build-android.result }}';
            const iosJob = '${{ steps.compose.outputs.ios_job }}';
            const iosOut = '${{ steps.compose.outputs.ios_out }}';
            const iosTxt = iosJob === 'skipped'
              ? '⚠️ no generado (requiere macOS + firmado)'
              : (iosOut === 'built' ? '✅ generado' : '❌ no se pudo generar');
            const body = `## 🏗️ Bitly — Builds\n\n| Plataforma | Estado |\n|---|---|\n| 🪟 Windows | ${win} |\n| 🤖 Android | ${and} |\n| 🍎 iOS | ${iosTxt} |\n\n> 🍎 iOS no se genera en runners de Windows/Linux; necesita macOS/Xcode. Detalle en [Run #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.startsWith('## 🏗️ Bitly — Builds'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body,
              });
            }
