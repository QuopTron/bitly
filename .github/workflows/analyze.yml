name: flutter analyze & test

on:
  push:
    branches: [main, recuperacion]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          cache: true

      - name: Generate secrets.dart
        run: cp lib/config/secrets.example.dart lib/config/secrets.dart

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (lib/)
        run: |
          set -o pipefail
          # Solo falla en errores reales. Hay 12 lints menores (warnings/infos)
          # pre-existentes; por defecto flutter analyze falla con CUALQUIER issue.
          if ! flutter analyze --no-fatal-warnings --no-fatal-infos lib/ 2>&1 | tee /tmp/analyze.log; then
            # GitHub solo muestra 10 annotations por nivel: filtrar las líneas
            # de error real (con ' error -' o paths), no el listado de paquetes.
            echo "::error::=== flutter analyze FAILED ==="
            grep -E "error -|: [A-Za-z]+: " /tmp/analyze.log | head -8 | while IFS= read -r line; do echo "::error::$line"; done
            grep -E "issues found|No issues" /tmp/analyze.log | tail -1 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Flutter test
        run: |
          set -o pipefail
          if ! flutter test 2>&1 | tee /tmp/test.log; then
            echo "::error::=== flutter test FAILED (tail del log) ==="
            grep -E "Some tests failed|failed|Expected:|Actual:|═|─" /tmp/test.log | head -8 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
