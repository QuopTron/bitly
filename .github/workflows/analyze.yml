name: flutter analyze & test

on:
  push:
    branches: [main, recuperacion]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          cache: true

      - name: Generate secrets.dart
        run: cp lib/config/secrets.example.dart lib/config/secrets.dart

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (lib/)
        run: flutter analyze lib/

      - name: Flutter test
        run: flutter test
