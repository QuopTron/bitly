name: flutter analyze & test

on:
  push:
    branches: [main, recuperacion]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          cache: true

      - name: Generate secrets.dart
        run: cp lib/config/secrets.example.dart lib/config/secrets.dart

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze (lib/)
        run: |
          set -o pipefail
          if ! flutter analyze lib/ 2>&1 | tee /tmp/analyze.log; then
            echo "::error::=== flutter analyze FAILED (tail del log) ==="
            tail -40 /tmp/analyze.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi

      - name: Flutter test
        run: |
          set -o pipefail
          if ! flutter test 2>&1 | tee /tmp/test.log; then
            echo "::error::=== flutter test FAILED (tail del log) ==="
            tail -40 /tmp/test.log | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
